[package]
name = "sylphx-apply"
version = "0.1.0"
description = "Declared Resources in sylphx.toml: parse, check, plan and apply them through the Sylphx Resource API (docs/specs/one-platform/sylphx-apply.md)."
keywords = ["sylphx", "declarative", "apply"]
categories = ["api-bindings"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository = "https://github.com/SylphxAI/sylphx-clients"
publish = false

[dependencies]
sylphx = { path = "../rust", version = "0.3.0" }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: RFC 8785 hashes need the exact double a number text names.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
toml = "0.8"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
