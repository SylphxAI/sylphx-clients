# Release of the generated Sylphx clients. Runs in the public mirror
# SylphxAI/sylphx-clients, which SylphxAI/cloud's release-clients.yml
# fast-forwards from `clients/` and tags `v{cli version}`. Linux builds run on
# Sylphx runners (`sylphx-linux-standard`); the macOS build runs on GitHub's
# free standard hosted macOS runner, because the Sylphx macOS pool does not
# serve public repositories (cloud#9512). The binaries carry signed build
# provenance (Sigstore, `gh attestation verify`). npm publish runs on GitHub's
# free standard runner (public repository) because npm provenance is generated
# only there.
#
# Every publish is idempotent (skipped when that version is on the registry)
# and read back. The newest stable GitHub Release becomes Latest here; older
# reruns and prereleases cannot replace it. npm packages keep their publishConfig
# dist-tag (`next`); npm/Homebrew promotion follows the production smoke.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)run, e.g. v0.24.0'
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: sylphx-linux-standard
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 10
        with:
          ref: ${{ env.TAG }}
      # Release-control scripts come from the workflow revision, not the
      # (possibly historical) release tag: an old tag's tree may predate the
      # current scripts, while its release sources must stay frozen at the tag.
      - uses: actions/checkout@v6
        timeout-minutes: 10
        with:
          ref: ${{ github.sha }}
          path: .release-control
      - id: v
        run: |
          set -euo pipefail
          version="${TAG#v}"
          cli="$(sed -n 's/^version = "\(.*\)"/\1/p' cli/Cargo.toml | head -1)"
          [ "$cli" = "$version" ] || { echo "::error::tag $TAG but cli/Cargo.toml is $cli"; exit 1; }
          for p in cli/npm/*/package.json mcp/npm/package.json; do
            [ "$(jq -r .version "$p")" = "$version" ] || { echo "::error::$p is not $version"; exit 1; }
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - name: Verify the exact Rust publish set without uploading
        run: |
          python3 -I .release-control/scripts/test-check-publish-set.py
          python3 -I .release-control/scripts/test-mark-latest-release.py
          python3 -I .release-control/scripts/test-wait-for-npm-version.py
          python3 -I .release-control/scripts/check-publish-set.py

  # Linux binaries: built on our runners inside a digest-pinned Ubuntu 22.04
  # (glibc 2.35), so they run on every distribution the hosted 22.04 image
  # covered. There is no arm64 runner class: arm64 is cross-compiled and
  # smoke-tested under QEMU.
  build-linux:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, asset: sylphx-cli-linux-x64, run: '' }
          - { target: aarch64-unknown-linux-gnu, asset: sylphx-cli-linux-arm64, run: 'qemu-aarch64 -L /usr/aarch64-linux-gnu' }
    runs-on: sylphx-linux-standard
    container: ubuntu:22.04@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02
    timeout-minutes: 45
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
    steps:
      - name: Build tools
        run: |
          set -eu
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git build-essential pkg-config python3 \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user >/dev/null
      - uses: actions/checkout@v6
        timeout-minutes: 10
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
      - name: Build
        run: |
          set -eu
          cargo build --release --locked -p sylphx-cli --target "${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/sylphx" "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"
      - name: Smoke
        run: |
          set -eu
          bin="${{ matrix.run }} dist/${{ matrix.asset }}"
          out="$($bin --version)"
          echo "$out"
          [ "$out" = "sylphx ${{ needs.check.outputs.version }}" ]
          $bin data databases create --help >/dev/null
          python3 -I scripts/test-smoke-mcp.py
          python3 -I scripts/smoke-mcp.py -- $bin mcp
          # No newer glibc symbol than Ubuntu 22.04's.
          ! objdump -T "dist/${{ matrix.asset }}" 2>/dev/null | grep -oE 'GLIBC_2\.(3[6-9]|[4-9][0-9])' | head -1 | grep -q .
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          # The release and npm jobs read these in the same run; 3 days is the
          # longest the organization's artifact retention allows and every hour
          # of it counts against the shared quota
          # (SylphxAI/.github docs/run-store.md).
          retention-days: 3

  # macOS binaries: GitHub's standard hosted macOS runner (Intel x86_64), free
  # on public repositories; arm64 is cross-compiled and has no smoke run. Only
  # the public mirror runs this job (if:), so a repository turned private, or a
  # copy of this workflow elsewhere, can never bill hosted minutes. Never use a
  # larger or paid macOS label here (scripts/check-no-github-hosted-runners.ts
  # rejects -large, -xlarge and gpu labels in these workflows).
  build-macos:
    needs: check
    if: github.repository == 'SylphxAI/sylphx-clients' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, asset: sylphx-cli-darwin-x64, run: true }
          - { target: aarch64-apple-darwin, asset: sylphx-cli-darwin-arm64, run: false }
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 10
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
      - name: Build
        run: |
          set -euo pipefail
          cargo build --release --locked -p sylphx-cli --target "${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/sylphx" "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"
      - name: Smoke
        if: matrix.run
        run: |
          set -euo pipefail
          out="$("dist/${{ matrix.asset }}" --version)"
          echo "$out"
          [ "$out" = "sylphx ${{ needs.check.outputs.version }}" ]
          "dist/${{ matrix.asset }}" data databases create --help >/dev/null
          python3 -I scripts/test-smoke-mcp.py
          python3 -I scripts/smoke-mcp.py -- "dist/${{ matrix.asset }}" mcp
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 3

  github-release:
    concurrency:
      group: client-github-release-latest
      cancel-in-progress: false
      # Queue every pending publication (up to GitHub's max) instead of the
      # default single pending slot, where a newer arrival would cancel the
      # pending job: an old-tag rerun must never cancel the newest tag's
      # pending publication (which would leave Latest behind).
      queue: max
    needs: [check, build-linux, build-macos]
    runs-on: sylphx-linux-standard
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 10
        with:
          ref: ${{ env.TAG }}
      # See the check job: control scripts come from the workflow revision.
      - uses: actions/checkout@v6
        timeout-minutes: 10
        with:
          ref: ${{ github.sha }}
          path: .release-control
      - uses: actions/download-artifact@v6
        with:
          path: dist
          pattern: sylphx-cli-*
          merge-multiple: true
      - name: Checksums and installer
        run: |
          set -euo pipefail
          cp cli/install.sh dist/install.sh
          cd dist && chmod +x sylphx-cli-* && sha256sum sylphx-cli-* install.sh > SHA256SUMS && cat SHA256SUMS
      - name: Build provenance (Sigstore)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'dist/sylphx-cli-*'
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            flags="--latest=false"
            [ "${{ needs.check.outputs.prerelease }}" = true ] && flags="$flags --prerelease"
            gh release create "$TAG" dist/* $flags --title "sylphx $TAG" \
              --notes "The \`sylphx\` CLI, MCP server, and SDKs ${TAG}.

          Install: \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/install.sh | sh\`
          Verify a binary: \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`
          npm: \`@sylphx/cli\`, \`@sylphx/mcp\`, \`@sylphx/sdk\` · crates.io: \`sylphx-cli\`, \`sylphx-mcp\`, \`sylphx\`"
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
          python3 -I .release-control/scripts/mark-latest-release.py

  # npm packages with npm provenance. The one job on a GitHub-hosted runner:
  # the free standard label, allowed for public repositories (owner#750),
  # because npm generates provenance only there.
  npm:
    needs: [check, build-linux, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 10
        with:
          ref: ${{ env.TAG }}
      # See the check job: control scripts come from the workflow revision.
      - uses: actions/checkout@v6
        timeout-minutes: 10
        with:
          ref: ${{ github.sha }}
          path: .release-control
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/download-artifact@v6
        with:
          path: dist
          pattern: sylphx-cli-*
          merge-multiple: true
      - name: Pack what npm does not have yet
        id: pack
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/npm"; mkdir -p "$out"; : > "$out/list"
          pack() {
            local dir="$1" name version tag tgz
            name="$(jq -r .name "$dir/package.json")"; version="$(jq -r .version "$dir/package.json")"
            tag="$(jq -r '.publishConfig.tag // "latest"' "$dir/package.json")"
            if [ "$(npm view "$name@$version" version 2>/dev/null || true)" = "$version" ]; then
              echo "$name@$version is on npm already"; return 0
            fi
            tgz="$(cd "$dir" && npm pack --silent --pack-destination "$out")"
            echo "$out/$tgz $tag $name $version" >> "$out/list"
          }
          for a in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            install -Dm755 "dist/sylphx-cli-$a" "cli/npm/cli-$a/bin/sylphx"
            pack "cli/npm/cli-$a"
          done
          pack cli/npm/cli
          pack mcp/npm
          (cd typescript && bun install --no-save && bun run build)
          scripts/smoke-npm.sh typescript
          pack typescript
          (cd next && bun install --no-save && bun run build)
          scripts/smoke-npm.sh next
          pack next
          cat "$out/list"
          echo "any=$([ -s "$out/list" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: steps.pack.outputs.any == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          while read -r tgz tag name version; do
            npm publish "$tgz" --access public --tag "$tag" --provenance
            python3 -I .release-control/scripts/wait-for-npm-version.py "$name" "$version"
            echo "readback: $name@$version ($tag)"
          done < "$RUNNER_TEMP/npm/list"

  crates:
    needs: [check, build-linux, build-macos]
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 10
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - name: Publish SDK crates before their consumers
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          on_registry() { curl -fsS -A 'SylphxAI-clients-release/1.0' "https://crates.io/api/v1/crates/$1/$2" >/dev/null 2>&1; }
          python3 -I scripts/check-publish-set.py --list > "$RUNNER_TEMP/crates-list"
          while read -r crate version; do
            if on_registry "$crate" "$version"; then echo "$crate@$version is on crates.io already"; continue; fi
            cargo publish --locked -p "$crate"
            for _ in $(seq 1 30); do on_registry "$crate" "$version" && break; sleep 10; done
            on_registry "$crate" "$version" || { echo "::error::$crate@$version did not appear"; exit 1; }
            echo "readback: $crate@$version"
          done < "$RUNNER_TEMP/crates-list"
