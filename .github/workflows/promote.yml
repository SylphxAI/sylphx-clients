# Promotes npm dist-tags and Homebrew once a release passed production smoke.
# GitHub's Latest mark is owned by the Release workflow and follows the newest
# published stable version, independently of npm/Homebrew promotion.
name: Promote

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

# Preserve pending completions and serialize smoke plus both public channels.
# Every completion reconciles the newest successful receipt, not its old source.
concurrency:
  group: client-production-promotion
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    # workflow_run grants secrets: admit only our successful immutable tag release.
    if: github.repository == 'SylphxAI/sylphx-clients' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: sylphx-linux-standard
    timeout-minutes: 15
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      sdk: ${{ steps.candidate.outputs.sdk }}
      source: ${{ steps.candidate.outputs.source }}
      eligible: ${{ steps.candidate.outputs.eligible }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Select the newest successful published candidate (never downgrade)
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
        run: python3 -I scripts/promote-npm.py select
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: steps.candidate.outputs.eligible == 'true'
        with:
          ref: ${{ steps.candidate.outputs.source }}
          path: candidate
          persist-credentials: false
      - name: Clean registry consumer against production
        if: steps.candidate.outputs.eligible == 'true'
        env:
          CLI_VERSION: ${{ steps.candidate.outputs.version }}
          SDK_VERSION: ${{ steps.candidate.outputs.sdk }}
        run: |
          set -euo pipefail
          control="$GITHUB_WORKSPACE/scripts/production-smoke.mjs"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          export HOME="$work/home" SYLPHX_CONFIG_DIR="$work/config" SYLPHX_NO_KEYCHAIN=1
          mkdir -p "$HOME" "$work/app" "$work/cache"
          unset SYLPHX_API_KEY SYLPHX_PUBLISHABLE_KEY SYLPHX_BASE_URL SYLPHX_URL SYLPHX_SECRET_URL
          cd "$work/app"
          echo '{"name":"production-release-smoke","private":true}' > package.json
          # Optional peers are still required when importing every SDK entry point.
          mapfile -t peers < <(node -e 'const p=require(process.argv[1]); for(const [n,v] of Object.entries(p.peerDependencies??{})) console.log(`${n}@${v}`)' "$GITHUB_WORKSPACE/candidate/typescript/package.json")
          npm install --registry=https://registry.npmjs.org --cache="$work/cache" --no-audit --no-fund --no-package-lock \
            "@sylphx/cli@$CLI_VERSION" "@sylphx/sdk@$SDK_VERSION" "${peers[@]}"
          node "$control"

  promote:
    needs: smoke
    if: needs.smoke.outputs.eligible == 'true'
    # npm trusted publishing (OIDC) runs on GitHub-hosted runners only; the
    # self-hosted JIT fleet cannot mint the required OIDC identity.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1
      - name: npm dist-tags (read back every write)
        env:
          V: ${{ needs.smoke.outputs.version }}
          S: ${{ needs.smoke.outputs.sdk }}
        run: python3 -I scripts/promote-npm.py promote

  homebrew:
    needs: [smoke, promote]
    if: needs.promote.result == 'success'
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        timeout-minutes: 10
        with:
          ref: ${{ needs.smoke.outputs.source }}
          persist-credentials: false
      - name: Tap token (SylphxAI/homebrew-tap only)
        id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          # sylphx-release-bot; a client ID is a valid JWT issuer.
          app-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: SylphxAI
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write
      # A pull request, not a push: the tap's merge queue runs brew style,
      # brew audit --strict --online, and an install test before it lands.
      - name: Formula bump pull request (auto-merge)
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          V: ${{ needs.smoke.outputs.version }}
        run: |
          set -euo pipefail
          GH_TOKEN="${{ github.token }}" gh release download "v$V" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP"
          scripts/brew-formula.sh "$V" "$RUNNER_TEMP/SHA256SUMS" > "$RUNNER_TEMP/sylphx.rb"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            clone -q https://github.com/SylphxAI/homebrew-tap.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          cp "$RUNNER_TEMP/sylphx.rb" Formula/sylphx.rb
          if git diff --quiet; then echo "readback: the tap formula is already $V"; exit 0; fi
          branch="sylphx-${V}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$branch"
          git -c user.name='sylphx-release-bot[bot]' -c user.email='sylphx-release-bot[bot]@users.noreply.github.com' \
            commit -qam "feat: sylphx $V"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push -q origin "HEAD:refs/heads/$branch"
          url="$(gh pr list -R SylphxAI/homebrew-tap --head "$branch" --json url --jq '.[0].url // ""')"
          [ -n "$url" ] || url="$(gh pr create -R SylphxAI/homebrew-tap --head "$branch" --title "feat: sylphx $V" \
            --body "Formula for sylphx v$V, rendered by scripts/brew-formula.sh from the release's SHA256SUMS.")"
          gh pr merge "$url" --auto --match-head-commit "$(git rev-parse HEAD)"
          echo "readback: $url (auto-merge on; lands after ci-ok)"
