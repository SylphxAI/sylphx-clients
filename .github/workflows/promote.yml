# Promotes a release to `latest` once it passed the production smoke: the
# npm dist-tag `latest` for @sylphx/cli (+ platform packages), @sylphx/mcp and
# @sylphx/sdk, and the GitHub Release's "Latest" mark (which `install.sh`
# follows), then opens the Homebrew tap's formula bump pull request.
name: Promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version, e.g. 0.24.0'
        required: true

permissions:
  contents: write

jobs:
  promote:
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm dist-tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          V: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The registry serves reads from a cache: right after a dist-tag
          # write, `npm view` can still show the old tag for some seconds
          # (the 0.25.1 promotion failed its readback five times over this).
          # Wait up to 60 s for the write to show before calling it failed.
          readback() {
            for _ in $(seq 1 12); do
              [ "$(npm view "$1" dist-tags.latest --prefer-online)" = "$2" ] && { echo "readback: $1 latest = $2"; return 0; }
              sleep 5
            done
            echo "::error::$1 latest is not $2 after 60 s"
            return 1
          }
          for p in @sylphx/cli-linux-x64 @sylphx/cli-linux-arm64 @sylphx/cli-darwin-x64 @sylphx/cli-darwin-arm64 @sylphx/cli @sylphx/mcp; do
            npm dist-tag add "$p@$V" latest
            readback "$p" "$V"
          done
          # The SDK has its own version; the release tag records it.
          S="$(curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/v$V/typescript/package.json" | jq -r .version)"
          npm dist-tag add "@sylphx/sdk@$S" latest
          readback @sylphx/sdk "$S"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ inputs.version }}
        run: |
          gh release edit "v$V" -R "$GITHUB_REPOSITORY" --prerelease=false --latest
          gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName

  homebrew:
    needs: promote
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 10
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - name: Tap token (SylphxAI/homebrew-tap only)
        id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          # sylphx-release-bot; a client ID is a valid JWT issuer.
          app-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: SylphxAI
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write
      # A pull request, not a push: the tap's merge queue runs brew style,
      # brew audit --strict --online, and an install test before it lands.
      - name: Formula bump pull request (auto-merge)
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          V: ${{ inputs.version }}
        run: |
          set -euo pipefail
          GH_TOKEN="${{ github.token }}" gh release download "v$V" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP"
          scripts/brew-formula.sh "$V" "$RUNNER_TEMP/SHA256SUMS" > "$RUNNER_TEMP/sylphx.rb"
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/SylphxAI/homebrew-tap.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          cp "$RUNNER_TEMP/sylphx.rb" Formula/sylphx.rb
          if git diff --quiet; then echo "readback: the tap formula is already $V"; exit 0; fi
          branch="sylphx-$V"
          git -c user.name='sylphx-release-bot[bot]' -c user.email='sylphx-release-bot[bot]@users.noreply.github.com' \
            commit -qam "feat: sylphx $V"
          git push -q -f origin "HEAD:refs/heads/$branch"
          url="$(gh pr list -R SylphxAI/homebrew-tap --head "$branch" --json url --jq '.[0].url // ""')"
          [ -n "$url" ] || url="$(gh pr create -R SylphxAI/homebrew-tap --head "$branch" --title "feat: sylphx $V" \
            --body "Formula for sylphx v$V, rendered by scripts/brew-formula.sh from the release's SHA256SUMS.")"
          gh pr merge "$url" --auto
          echo "readback: $url (auto-merge on; lands after ci-ok)"
