[package]
name = "sylphx-workload"
version = "0.1.0"
description = "SPIFFE Workload API JWT-SVID client and customer workload identity helpers"
keywords = ["sylphx", "spiffe", "spire", "workload", "identity"]
categories = ["api-bindings", "authentication"]
documentation = "https://docs.rs/sylphx-workload"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["workload"]
# Native SPIFFE Workload API transport and JWT lifetime inspection.
# Customer identity naming and parsing need no dependencies or features.
workload = ["dep:h2", "dep:http", "dep:bytes", "dep:tokio", "dep:base64", "dep:serde_json"]

[dependencies]
h2 = { version = "0.4", optional = true }
http = { version = "1", optional = true }
bytes = { version = "1", optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "time", "net"], optional = true }
base64 = { version = "0.22", optional = true }
serde_json = { version = "1", optional = true }
