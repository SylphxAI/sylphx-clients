[package]
name = "sylphx-mcp"
version = "0.29.4"
description = "The Sylphx MCP server: every Sylphx API method as MCP tools, generated from the Sylphx schema registry."
keywords = ["sylphx", "mcp", "mcp-server", "agents"]
categories = ["command-line-utilities", "api-bindings"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository = "https://github.com/SylphxAI/sylphx-clients"

[[bin]]
name = "sylphx-mcp"
path = "src/main.rs"

[dependencies]
sylphx = { path = "../rust", version = "0.3.1" }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
