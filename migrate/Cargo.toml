[package]
name = "sylphx-migrate"
version = "0.1.4"
description = "PostgreSQL migration planning and execution for Sylphx."
edition = "2021"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/SylphxAI/sylphx-clients"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
tokio = { version = "1", features = ["time"] }
url = "2"
