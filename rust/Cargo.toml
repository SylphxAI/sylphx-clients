[package]
name = "sylphx"
version = "0.3.4"
description = "The Sylphx SDK: one API, one key, every Sylphx service. Generated from the Sylphx schema registry."
keywords = ["sylphx", "sdk", "api", "cloud"]
categories = ["api-bindings", "web-programming::http-client"]
readme = "README.md"
documentation = "https://docs.rs/sylphx"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# `resource` and `stream` are default so CI tests and clippy build both.
default = ["http", "verify", "resource", "stream"]
# The production transport (reqwest + rustls). Without it, bring a `Transport`.
http = ["dep:reqwest", "dep:tokio", "dep:fastrand"]
# Offline verification of Sylphx-signed tokens (`sylphx::auth::verify`).
verify = ["dep:p256", "dep:ed25519-dalek", "dep:base64"]
# The Sandboxes display stream protocol: frame types and the in-memory mock
# machine (`sylphx::sandboxes::stream`, `sylphx::sandboxes::stream_mock`).
stream = ["dep:base64"]
# Protected-resource OAuth for MCP servers (`sylphx::auth::resource`).
resource = ["http", "dep:base64", "dep:sha2"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "stream"], optional = true }
tokio = { version = "1", features = ["time", "sync"], optional = true }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"], optional = true }
ed25519-dalek = { version = "2", default-features = false, features = ["std"], optional = true }
base64 = { version = "0.22", optional = true }
sha2 = { version = "0.10", optional = true }
# `sylphx::ids` mints and reads ids in every build.
uuid = { version = "1", features = ["v7"] }
fastrand = { version = "2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
