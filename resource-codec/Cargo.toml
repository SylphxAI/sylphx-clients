[package]
name = "sylphx-resource-codec"
version = "0.1.0"
description = "Sylphx's native Resource API registry, routing, schema validation, and problem details. Shared by clients and the Resource API front."
keywords = ["sylphx", "api", "schema", "validation"]
categories = ["api-bindings"]
edition.workspace = true
rust-version = "1.99"
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
